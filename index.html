<!DOCTYPE html>
<html lang="vi">

  <title>Thư 20.11 ✉️</title>

  <meta http-equiv="Cache-Control" content="no-cache" />
  <script>
    // Phiên bản do GitHub Actions gắn khi deploy (chạy local thì giữ nguyên "__BUILD__")
    window.BUILD = "__BUILD__";
    // Tự xóa cache: nếu trên server có bản mới hơn thì tải lại trang với ?v=<bản mới>
    (function () {
      if (window.BUILD.indexOf("__") === 0 || !window.fetch) return;
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.v || d.v === window.BUILD) return;
          var u = new URL(location.href);
          if (u.searchParams.get("v") === d.v) return;
          u.searchParams.set("v", d.v);
          location.replace(u.toString());
        })
        .catch(function () {});
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body class="intro">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="smudge sm1" aria-hidden="true"></div>
  <div class="smudge sm2" aria-hidden="true"></div>
  <div class="board-frame" aria-hidden="true"></div>
  <div class="chalk-tray" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

  <!-- ===== Màn 1: bảng đen + phong bì ===== -->
  <section class="scene-intro" id="intro">
    <h1 class="sr-only" id="srTitle"></h1>
    <p class="sky-sub" id="skySub"></p>

    <div class="env-wrap" id="envWrap">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-letter">
          <span class="mini-note" id="miniNote"></span>
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="env-pocket"></div>
        <div class="env-flap"></div>
        <button class="seal" id="seal" type="button" aria-label="Mở thư"><span>20·11</span></button>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </section>

      <header class="letter-head" id="letterHead">
        <figure class="polaroid" id="polaroid">
          <span class="tape" aria-hidden="true"></span>
          <img id="photo" alt="" />

        <div class="head-text">
          <p class="greeting" id="greeting"></p>
          <h2 class="name" id="name"></h2>
        </div>
      </header>

      <div class="letter-body" id="letterBody"></div>

        <div class="sign-text">
          <p class="closing" id="closing"></p>
          <p class="signature" id="signature"></p>

            <path pathLength="1" d="M4 12 C30 2 50 18 80 10 C110 2 130 16 156 6" />

  <canvas id="fx" aria-hidden="true"></canvas>
  <p class="skip-hint" id="skipHint">Chạm vào thư để đọc nhanh</p>
