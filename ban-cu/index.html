<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe8d6" />
  <title>Thiệp 20.11 💐</title>
  <meta name="description" content="Tấm thiệp nhỏ tri ân nhân ngày Nhà giáo Việt Nam 20/11" />
  <meta property="og:title" content="Thiệp 20.11 tặng cô 💐" />
  <meta property="og:description" content="Chạm để mở thiệp nhé!" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <script>
    // Phiên bản do GitHub Actions gắn khi deploy (chạy local thì giữ nguyên "__BUILD__")
    window.BUILD = "__BUILD__";
    // Tự xóa cache: nếu trên server có bản mới hơn thì tải lại trang với ?v=<bản mới>
    (function () {
      if (window.BUILD.indexOf("__") === 0 || !window.fetch) return;
      fetch("../version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.v || d.v === window.BUILD) return;
          var u = new URL(location.href);
          if (u.searchParams.get("v") === d.v) return;
          u.searchParams.set("v", d.v);
          location.replace(u.toString());
        })
        .catch(function () {});
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=__BUILD__" />
</head>
<body>
  <!-- SVG dùng chung -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="velvet" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="44">
        <stop offset="0" stop-color="#4a000e" />
        <stop offset="0.45" stop-color="#9d0b2e" />
        <stop offset="0.82" stop-color="#d1234f" />
        <stop offset="1" stop-color="#ff7a99" />
      </radialGradient>
      <radialGradient id="bud" gradientUnits="userSpaceOnUse" cx="48" cy="46" r="16">
        <stop offset="0" stop-color="#e0315c" />
        <stop offset="1" stop-color="#5c0015" />
      </radialGradient>
      <radialGradient id="peachG" gradientUnits="userSpaceOnUse" cx="20" cy="20" r="17">
        <stop offset="0" stop-color="#ff4f86" />
        <stop offset=".35" stop-color="#ff8fb1" />
        <stop offset="1" stop-color="#ffe4ec" />
      </radialGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7cc46a" />
        <stop offset="1" stop-color="#2f6b2a" />
      </linearGradient>
      <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d1495b" />
        <stop offset="1" stop-color="#8f2d56" />
      </linearGradient>
      <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" />
        <stop offset="1" stop-color="#f6c8d4" />
      </linearGradient>

      <!-- Hoa hồng nhung -->
      <symbol id="rose" viewBox="0 0 100 100">
        <g stroke="#ff9db3" stroke-opacity=".35" stroke-width=".8">
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(72 50 50)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(144 50 50)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(216 50 50)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(288 50 50)" />
          <g transform="translate(50 50) scale(.7) translate(-50 -50)">
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(36 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(108 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(180 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(252 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(324 50 50)" />
          </g>
        </g>
        <circle cx="50" cy="50" r="15" fill="url(#bud)" />
        <path d="M50 38 C61 38 64 51 54 56 C44 61 37 51 44 45 C49 41 55 46 51 51"
              fill="none" stroke="#3d000b" stroke-width="1.6" stroke-linecap="round" opacity=".75" />
      </symbol>

      <!-- Hoa đào -->
      <symbol id="peach" viewBox="0 0 40 40">
        <g fill="url(#peachG)" stroke="#ff5d8f" stroke-width=".8">
          <path d="M20 20 C12 15 11 6 17.5 4 Q20 6.5 22.5 4 C29 6 28 15 20 20Z" />
          <path d="M20 20 C12 15 11 6 17.5 4 Q20 6.5 22.5 4 C29 6 28 15 20 20Z" transform="rotate(72 20 20)" />
          <path d="M20 20 C12 15 11 6 17.5 4 Q20 6.5 22.5 4 C29 6 28 15 20 20Z" transform="rotate(144 20 20)" />
          <path d="M20 20 C12 15 11 6 17.5 4 Q20 6.5 22.5 4 C29 6 28 15 20 20Z" transform="rotate(216 20 20)" />
          <path d="M20 20 C12 15 11 6 17.5 4 Q20 6.5 22.5 4 C29 6 28 15 20 20Z" transform="rotate(288 20 20)" />
        </g>
        <path d="M20 20 L20 13 M20 20 L24.9 15.1 M20 20 L27 20 M20 20 L24.9 24.9 M20 20 L20 27 M20 20 L15.1 24.9 M20 20 L13 20 M20 20 L15.1 15.1"
              stroke="#c9184a" stroke-width=".7" stroke-linecap="round" />
        <g fill="#ffd166">
          <circle cx="20" cy="13" r="1" /><circle cx="24.9" cy="15.1" r="1" /><circle cx="27" cy="20" r="1" /><circle cx="24.9" cy="24.9" r="1" />
          <circle cx="20" cy="27" r="1" /><circle cx="15.1" cy="24.9" r="1" /><circle cx="13" cy="20" r="1" /><circle cx="15.1" cy="15.1" r="1" />
        </g>
        <circle cx="20" cy="20" r="2.4" fill="#c9184a" />
      </symbol>

      <!-- Hoa cúc, màu cánh lấy theo "color" -->
      <symbol id="daisy" viewBox="0 0 40 40">
        <g fill="currentColor" stroke="rgba(0,0,0,.12)" stroke-width=".5">
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(30 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(60 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(90 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(120 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(150 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(180 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(210 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(240 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(270 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(300 20 20)" />
          <ellipse cx="20" cy="10" rx="3.6" ry="8.5" transform="rotate(330 20 20)" />
        </g>
        <circle cx="20" cy="20" r="5.5" fill="#f4a100" />
        <circle cx="18.5" cy="18.5" r="2" fill="#ffe08a" />
      </symbol>

      <!-- Cành đào ở góc khung (góc khung ở tọa độ 16,16) -->
      <symbol id="peachBranch" viewBox="0 0 90 90">
        <g fill="none" stroke="#6b3e26" stroke-linecap="round">
          <path d="M6 18 C26 14 46 20 82 10" stroke-width="2.6" />
          <path d="M18 6 C14 26 20 46 10 82" stroke-width="2.6" />
          <path d="M52 17 C57 23 61 25 67 25" stroke-width="1.4" />
          <path d="M17 52 C23 57 25 61 25 67" stroke-width="1.4" />
        </g>
        <g fill="#7cc46a">
          <ellipse cx="0" cy="0" rx="2" ry="5" transform="translate(64 9) rotate(60)" />
          <ellipse cx="0" cy="0" rx="2" ry="5" transform="translate(9 64) rotate(30)" />
        </g>
        <g fill="#ff6b9a" stroke="#6b3e26" stroke-width=".6">
          <ellipse cx="0" cy="0" rx="3" ry="4.5" transform="translate(83 9) rotate(75)" />
          <ellipse cx="0" cy="0" rx="3" ry="4.5" transform="translate(9 83) rotate(15)" />
          <ellipse cx="0" cy="0" rx="2.6" ry="4" transform="translate(69 25) rotate(100)" />
          <ellipse cx="0" cy="0" rx="2.6" ry="4" transform="translate(25 69) rotate(-10)" />
        </g>
        <use href="#peach" x="33" y="3" width="24" height="24" />
        <use href="#peach" x="3" y="33" width="24" height="24" />
        <use href="#peach" x="-1" y="-1" width="36" height="36" />
      </symbol>
    </defs>
  </svg>

  <div class="bokeh" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="burst" id="burst" aria-hidden="true"></div>

  <main class="stage">
    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card">

        <!-- Bên trong thiệp -->
        <section class="inside">
          <div class="inside-flowers" aria-hidden="true">
            <svg class="fl fl-1" style="color:#ffd166"><use href="#daisy" /></svg>
            <svg class="fl fl-2" style="color:#c77dff"><use href="#daisy" /></svg>
            <svg class="fl fl-3"><use href="#peach" /></svg>
            <svg class="fl fl-4"><use href="#rose" /></svg>
            <svg class="fl fl-5" style="color:#ff9f6b"><use href="#daisy" /></svg>
          </div>
          <div class="inside-scroll" id="insideScroll">
            <div class="header">
              <div class="avatar" id="avatar" hidden>
                <img id="avatarImg" alt="" />
                <span class="avatar-badge" aria-hidden="true">📖</span>
              </div>
              <h2 class="title" id="title"></h2>
            </div>
            <p class="message" id="message"></p>
            <p class="signature" id="signature"></p>
          </div>
          <button class="replay" id="replayBtn" type="button" aria-label="Xem lại" title="Xem lại">↺</button>
        </section>

        <!-- Bìa thiệp -->
        <section class="cover" id="cover" role="button" tabindex="0" aria-label="Mở thiệp">
          <div class="cover-face cover-front">
            <div class="cover-frame">
              <p class="cover-top" id="coverTop"></p>
              <h1 class="cover-big" id="coverBig"></h1>

              <!-- Quyển sách mở + bút lông + hoa -->
              <svg class="book" viewBox="0 0 200 150" aria-hidden="true">
                <ellipse cx="100" cy="140" rx="86" ry="7" fill="rgba(143,45,86,.18)" />
                <path d="M6 54 L6 134 C36 124 70 124 100 136 C130 124 164 124 194 134 L194 54 Z" fill="url(#bookCover)" />
                <path d="M100 50 C70 38 36 38 12 48 L12 128 C36 118 70 118 100 130Z" fill="#fffdf8" stroke="#e9d6bb" stroke-width="1" />
                <path d="M100 50 C130 38 164 38 188 48 L188 128 C164 118 130 118 100 130Z" fill="#fffaf2" stroke="#e9d6bb" stroke-width="1" />
                <g stroke="#e4cfae" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 62 C46 55 70 55 90 62" /><path d="M24 74 C46 67 70 67 90 74" />
                  <path d="M24 86 C46 79 70 79 90 86" /><path d="M24 98 C46 91 70 91 82 96" />
                  <path d="M110 62 C130 55 154 55 176 62" /><path d="M110 74 C130 67 154 67 176 74" />
                  <path d="M110 86 C130 79 154 79 176 86" />
                </g>
                <path d="M100 50 L100 130" stroke="#d9bf98" stroke-width="1.5" />
                <!-- bút lông -->
                <g transform="translate(150 66) rotate(35)">
                  <path d="M0 -44 C14 -36 14 -8 2 18 L-2 18 C-12 -8 -12 -36 0 -44Z" fill="url(#quill)" stroke="#e29bb0" stroke-width="1" />
                  <path d="M0 -40 L0 22" stroke="#d17a96" stroke-width="1" />
                  <path d="M-2 18 L0 30 L2 18Z" fill="#5c4033" />
                </g>
                <!-- hoa trên sách -->
                <use href="#daisy" x="8" y="22" width="30" height="30" style="color:#ffd166" />
                <use href="#peach" x="54" y="14" width="32" height="32" />
                <use href="#rose" x="22" y="2" width="44" height="44" />
              </svg>

              <p class="cover-sub" id="coverSub"></p>
            </div>
            <svg class="frame-flower ff-tr" viewBox="0 0 90 90" aria-hidden="true">
              <g transform="translate(90 0) scale(-1 1)"><use href="#peachBranch" width="90" height="90" /></g>
            </svg>
            <svg class="frame-flower ff-bl" viewBox="0 0 90 90" aria-hidden="true">
              <g transform="translate(0 90) scale(1 -1)"><use href="#peachBranch" width="90" height="90" /></g>
            </svg>
            <span class="shine" aria-hidden="true"></span>
          </div>
          <div class="cover-face cover-back"></div>
        </section>

      </div>

      <div class="deco" aria-hidden="true">
        <span class="spark sp1">✦</span>
        <span class="spark sp2">✦</span>
        <span class="spark sp3">✦</span>
        <span class="spark sp4">✦</span>
        <span class="spark sp5">✦</span>
      </div>
    </div>

    <button class="open-btn" id="openBtn" type="button"></button>
  </main>

  <script src="config.js?v=__BUILD__"></script>
  <script src="script.js?v=__BUILD__"></script>
</body>
</html>
